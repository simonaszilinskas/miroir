name: check

# Pushes to main, and pull requests: a pull request branch runs once, not twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # A new push to a pull request cancels its older run; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: gitleaks/gitleaks-action@v2
        with:
          # .gitleaksignore is read automatically.
          redact: true
      - run: uv sync --locked
      - run: make check
